apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: paperless-ngx-default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: paperless-ngx-allow-approved-traffic
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: paperless-ngx
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - ipBlock:
            cidr: REPLACE_WITH_APPROVED_INGRESS_SOURCE_CIDR
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: REPLACE_WITH_APPROVED_POSTGRES_CIDR
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - ipBlock:
            cidr: REPLACE_WITH_APPROVED_VALKEY_CIDR
      ports:
        - protocol: TCP
          port: 6379
