apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-ngx-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: REPLACE_WITH_APPROVED_CSI_STORAGE_CLASS
  resources:
    requests:
      storage: REPLACE_WITH_DATA_CAPACITY
