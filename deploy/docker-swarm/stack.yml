# ArchiveWeaver Docker Swarm envelope.
# Replace the image and volume driver with approved production values.
version: "3.9"
services:
  app:
    image: "${ARCHIVEWEAVER_SOLUTION_IMAGE:?set an approved pinned image reference}"
    # No routing-mesh port is published. Attach a reviewed TLS reverse proxy
    # to this stack network and route to app:8080.
    environment:
      ARCHIVEWEAVER_SOLUTION_ID: "${ARCHIVEWEAVER_SOLUTION_ID:?set the catalog solution id}"
    volumes:
      - archiveweaver-data:/var/lib/archiveweaver/solution
    deploy:
      replicas: 3
      update_config:
        order: start-first
        parallelism: 1
      restart_policy:
        condition: on-failure
      placement:
        max_replicas_per_node: 1

volumes:
  archiveweaver-data:
    external: true
    name: "${ARCHIVEWEAVER_DATA_VOLUME:?set a reviewed distributed volume name}"

# The named external volume must use a tested distributed driver or otherwise
# provide shared/replicated state. Verify restore behavior before scaling.
