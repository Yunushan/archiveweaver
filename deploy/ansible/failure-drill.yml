---
- name: Validate the pinned Ansible controller
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    archiveweaver_controller_target_group: archiveweaver_failure
  pre_tasks:
    - name: Enable post-play failure evidence sealing
      ansible.builtin.set_fact:
        archiveweaver_evidence_seal_enabled: "{{ archiveweaver_failure_apply | default(false) | bool }}"
  roles:
    - role: archiveweaver_controller_preflight
      tags: [always, controller]

- name: ArchiveWeaver non-production failure-domain drill
  hosts: archiveweaver_failure
  become: true
  gather_facts: true
  serial: 1
  any_errors_fatal: true
  vars:
    archiveweaver_failure_apply: false
    archiveweaver_failure_environment: staging
    archiveweaver_failure_change_id: FD-PLAN
    archiveweaver_failure_tests: []
    archiveweaver_failure_evidence_dir: "{{ archiveweaver_bundle_root }}/evidence/failure-drill"
  roles:
    - role: archiveweaver_failure
      tags: [failure-drill]

- name: Seal failure-drill evidence after all test hosts complete
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    archiveweaver_evidence_completion_fact: archiveweaver_failure_completed
    archiveweaver_evidence_completion_hosts: "{{ groups['archiveweaver_failure'] | default([]) }}"
  roles:
    - role: archiveweaver_evidence
      when: archiveweaver_evidence_seal_enabled | default(false) | bool
      tags: [evidence]
