---
- name: Require completed controller preflight
  ansible.builtin.include_tasks:
    file: "{{ role_path | dirname }}/archiveweaver_controller_preflight/tasks/require-complete.yml"
    apply:
      tags: [provider, deploy]
  tags: [provider, deploy]

- name: Require completed managed-host preflight
  ansible.builtin.include_tasks:
    file: "{{ role_path | dirname }}/archiveweaver_controller_preflight/tasks/require-managed-complete.yml"
    apply:
      tags: [provider, deploy]
  tags: [provider, deploy]

- name: Validate provider envelope prerequisites
  ansible.builtin.assert:
    that:
      - archiveweaver_product_stack_ready | bool
      - archiveweaver_release_manifest_verified | bool
    fail_msg: "Provider application is blocked until the official product stack and release manifest are verified."
  when: not archiveweaver_preflight_is_staging_preview | default(false) | bool
  tags: [provider, deploy]

- name: Apply the raw systemd provider envelope
  ansible.builtin.include_tasks: raw.yml
  when: archiveweaver_runtime == 'raw'
  tags: [provider, deploy]

- name: Apply the Podman Quadlet provider envelope
  ansible.builtin.include_tasks: podman-quadlet.yml
  when: archiveweaver_runtime == 'podman-quadlet'
  tags: [provider, deploy]

- name: Apply the Docker Compose provider envelope
  ansible.builtin.include_tasks: docker.yml
  when:
    - archiveweaver_runtime == 'docker'
    - inventory_hostname == groups['archiveweaver_app'][0]
  tags: [provider, deploy]

- name: Apply the Docker Swarm provider envelope
  ansible.builtin.include_tasks: docker-swarm.yml
  when:
    - archiveweaver_runtime == 'docker-swarm'
    - inventory_hostname == groups['archiveweaver_control'][0]
  tags: [provider, deploy]

- name: Apply a Kubernetes-family provider envelope
  ansible.builtin.include_tasks: kubernetes.yml
  when: archiveweaver_runtime in ['k3s', 'rke2', 'k0s', 'microk8s']
  tags: [provider, deploy]

- name: Fail closed for Pacemaker deployment resources
  ansible.builtin.fail:
    msg: "Ansible does not invent Pacemaker resources. Apply the reviewed VIP, storage, STONITH, and application resource runbook separately."
  when: archiveweaver_runtime == 'pacemaker'
  tags: [provider, deploy]

- name: Record the verified release identity after provider reconciliation
  ansible.builtin.copy:
    dest: "{{ archiveweaver_release_record }}"
    owner: root
    group: root
    mode: '0644'
    content: |
      solution: {{ archiveweaver_solution_id | to_json }}
      release: {{ archiveweaver_release | to_json }}
      catalog_os: {{ archiveweaver_os_id | to_json }}
      runtime: {{ archiveweaver_runtime | to_json }}
      orchestration_runtime: ansible
      underlying_runtime: {{ archiveweaver_runtime | to_json }}
      change_id: {{ archiveweaver_change_id | to_json }}
      source_commit: {{ lookup('ansible.builtin.env', 'ARCHIVEWEAVER_IMMUTABLE_REF') | to_json }}
      readiness_manifest_sha256: {{ lookup('ansible.builtin.env', 'ARCHIVEWEAVER_READINESS_MANIFEST_SHA256') | to_json }}
      execution_environment_digest: {{ archiveweaver_execution_environment_digest | to_json }}
      provider_bundle_sha256: {{ archiveweaver_provider_bundle_sha256 | to_json }}
      product_stack_sha256: {{ archiveweaver_product_stack_sha256 | to_json }}
      kustomize_bundle_sha256: {{ archiveweaver_kustomize_bundle_sha256 | to_json }}
  no_log: true
  when: archiveweaver_apply | bool
  tags: [provider, release]
