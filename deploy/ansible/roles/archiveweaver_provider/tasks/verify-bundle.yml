---
- name: Inspect the raw provider unit during verification
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ archiveweaver_service_name }}.service"
    follow: false
    get_checksum: true
    checksum_algorithm: sha256
  register: archiveweaver_provider_verify_raw_unit_stat
  when: archiveweaver_runtime == 'raw'
  tags: [verify]

- name: Require the verified raw provider unit to match its release digest
  ansible.builtin.assert:
    that:
      - archiveweaver_provider_verify_raw_unit_stat.stat.exists
      - archiveweaver_provider_verify_raw_unit_stat.stat.isreg | default(false) | bool
      - not (archiveweaver_provider_verify_raw_unit_stat.stat.islnk | default(false) | bool)
      - archiveweaver_provider_verify_raw_unit_stat.stat.uid | int == 0
      - archiveweaver_provider_verify_raw_unit_stat.stat.gid | int == 0
      - archiveweaver_provider_verify_raw_unit_stat.stat.mode == '0644'
      - archiveweaver_provider_bundle_sha256 is string
      - archiveweaver_provider_bundle_sha256 is match('^[0-9a-f]{64}$')
      - archiveweaver_provider_verify_raw_unit_stat.stat.checksum == archiveweaver_provider_bundle_sha256
    fail_msg: "The verified raw provider unit has drifted from the reviewed release."
  when: archiveweaver_runtime == 'raw'
  no_log: true
  tags: [verify]

- name: Define solution-scoped Quadlet files during verification
  ansible.builtin.set_fact:
    archiveweaver_provider_quadlet_verify_files:
      - {name: network, path: "/etc/containers/systemd/archiveweaver-{{ archiveweaver_solution_id }}.network"}
      - {name: volume, path: "/etc/containers/systemd/archiveweaver-{{ archiveweaver_solution_id }}.volume"}
      - {name: container, path: "/etc/containers/systemd/{{ archiveweaver_service_name }}.container"}
  when: archiveweaver_runtime == 'podman-quadlet'
  no_log: true
  tags: [verify]

- name: Inspect the Quadlet provider files during verification
  ansible.builtin.stat:
    path: "{{ item.path }}"
    follow: false
    get_checksum: true
    checksum_algorithm: sha256
  loop: "{{ archiveweaver_provider_quadlet_verify_files | default([]) }}"
  register: archiveweaver_provider_verify_quadlet_file_stats
  when: archiveweaver_runtime == 'podman-quadlet'
  tags: [verify]

- name: Build the verified Quadlet digest input
  ansible.builtin.set_fact:
    archiveweaver_provider_verify_quadlet_digest_input: >-
      {{ (archiveweaver_provider_verify_quadlet_digest_input | default([]))
         + [item.item.name ~ ':' ~ item.stat.checksum] }}
  loop: "{{ archiveweaver_provider_verify_quadlet_file_stats.results | default([]) }}"
  no_log: true
  when: archiveweaver_runtime == 'podman-quadlet'
  tags: [verify]

- name: Require the verified Quadlet provider to match its release digest
  ansible.builtin.assert:
    that:
      - archiveweaver_provider_verify_quadlet_file_stats.results | length == 3
      - archiveweaver_provider_verify_quadlet_file_stats.results | selectattr('stat.exists', 'equalto', true) | list | length == 3
      - archiveweaver_provider_verify_quadlet_file_stats.results | selectattr('stat.isreg', 'equalto', true) | list | length == 3
      - >-
        archiveweaver_provider_verify_quadlet_file_stats.results
        | selectattr('stat.islnk', 'defined')
        | selectattr('stat.islnk', 'equalto', true)
        | list | length == 0
      - archiveweaver_provider_bundle_sha256 is string
      - archiveweaver_provider_bundle_sha256 is match('^[0-9a-f]{64}$')
      - (archiveweaver_provider_verify_quadlet_digest_input | default([]) | join('\n') | hash('sha256')) == archiveweaver_provider_bundle_sha256
    fail_msg: "The verified Quadlet provider has drifted from the reviewed release."
  when: archiveweaver_runtime == 'podman-quadlet'
  no_log: true
  tags: [verify]

- name: Require verified Quadlet files to be root-owned and non-writable by others
  ansible.builtin.assert:
    that:
      - item.stat.uid | int == 0
      - item.stat.gid | int == 0
      - item.stat.mode == '0644'
    fail_msg: "Verified Quadlet provider files must be root-owned with mode 0644."
  loop: "{{ archiveweaver_provider_verify_quadlet_file_stats.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name | default('quadlet') }}"
  when: archiveweaver_runtime == 'podman-quadlet'
  no_log: true
  tags: [verify]

- name: Inspect the staged Compose bundle during verification
  ansible.builtin.stat:
    path: "{{ archiveweaver_compose_path }}"
    follow: false
    get_checksum: true
    checksum_algorithm: sha256
  register: archiveweaver_provider_verify_compose_stat
  when:
    - archiveweaver_runtime == 'docker'
    - inventory_hostname == groups['archiveweaver_app'][0]
  tags: [verify]

- name: Require the verified Compose bundle to match its release digest
  ansible.builtin.assert:
    that:
      - archiveweaver_provider_verify_compose_stat.stat.exists
      - archiveweaver_provider_verify_compose_stat.stat.isreg | default(false) | bool
      - not (archiveweaver_provider_verify_compose_stat.stat.islnk | default(false) | bool)
      - archiveweaver_provider_verify_compose_stat.stat.uid | int == 0
      - archiveweaver_provider_verify_compose_stat.stat.gid | int == 0
      - archiveweaver_provider_verify_compose_stat.stat.mode is match('^0[0-7][0-5][0-5]$')
      - archiveweaver_product_stack_sha256 is string
      - archiveweaver_product_stack_sha256 is match('^[0-9a-f]{64}$')
      - archiveweaver_provider_verify_compose_stat.stat.checksum == archiveweaver_product_stack_sha256
    fail_msg: "The verified Compose bundle is missing, symlinked, or has drifted from the reviewed release."
  when:
    - archiveweaver_runtime == 'docker'
    - inventory_hostname == groups['archiveweaver_app'][0]
  no_log: true
  tags: [verify]

- name: Re-render the verified Compose model read-only
  ansible.builtin.command:
    argv: [docker, compose, -f, "{{ archiveweaver_compose_path }}", config]
  register: archiveweaver_provider_verify_compose_config
  changed_when: false
  check_mode: false
  when:
    - archiveweaver_runtime == 'docker'
    - inventory_hostname == groups['archiveweaver_app'][0]
  no_log: true
  tags: [verify]

- name: Require immutable images in the verified Compose model
  ansible.builtin.include_tasks: require-immutable-images.yml
  vars:
    archiveweaver_provider_rendered_content: "{{ archiveweaver_provider_verify_compose_config.stdout }}"
  when:
    - archiveweaver_runtime == 'docker'
    - inventory_hostname == groups['archiveweaver_app'][0]
  tags: [verify]

- name: Require signed image coverage during Compose verification
  ansible.builtin.include_tasks: require-signed-image-coverage.yml
  vars:
    archiveweaver_provider_image_coverage_runtime: docker
    archiveweaver_provider_image_coverage_model: "{{ archiveweaver_provider_verify_compose_config.stdout }}"
  when:
    - archiveweaver_runtime == 'docker'
    - inventory_hostname == groups['archiveweaver_app'][0]
  tags: [verify]

- name: Inspect the staged Swarm bundle during verification
  ansible.builtin.stat:
    path: "{{ archiveweaver_compose_path }}"
    follow: false
    get_checksum: true
    checksum_algorithm: sha256
  register: archiveweaver_provider_verify_swarm_stat
  when:
    - archiveweaver_runtime == 'docker-swarm'
    - inventory_hostname == groups['archiveweaver_control'][0]
  tags: [verify]

- name: Require the verified Swarm bundle to match its release digest
  ansible.builtin.assert:
    that:
      - archiveweaver_provider_verify_swarm_stat.stat.exists
      - archiveweaver_provider_verify_swarm_stat.stat.isreg | default(false) | bool
      - not (archiveweaver_provider_verify_swarm_stat.stat.islnk | default(false) | bool)
      - archiveweaver_provider_verify_swarm_stat.stat.uid | int == 0
      - archiveweaver_provider_verify_swarm_stat.stat.gid | int == 0
      - archiveweaver_provider_verify_swarm_stat.stat.mode is match('^0[0-7][0-5][0-5]$')
      - archiveweaver_product_stack_sha256 is string
      - archiveweaver_product_stack_sha256 is match('^[0-9a-f]{64}$')
      - archiveweaver_provider_verify_swarm_stat.stat.checksum == archiveweaver_product_stack_sha256
    fail_msg: "The verified Swarm bundle is missing, symlinked, or has drifted from the reviewed release."
  when:
    - archiveweaver_runtime == 'docker-swarm'
    - inventory_hostname == groups['archiveweaver_control'][0]
  no_log: true
  tags: [verify]

- name: Re-render the verified Swarm model read-only
  ansible.builtin.command:
    argv: [docker, stack, config, -c, "{{ archiveweaver_compose_path }}"]
  register: archiveweaver_provider_verify_swarm_config
  changed_when: false
  check_mode: false
  when:
    - archiveweaver_runtime == 'docker-swarm'
    - inventory_hostname == groups['archiveweaver_control'][0]
  no_log: true
  tags: [verify]

- name: Require immutable images in the verified Swarm model
  ansible.builtin.include_tasks: require-immutable-images.yml
  vars:
    archiveweaver_provider_rendered_content: "{{ archiveweaver_provider_verify_swarm_config.stdout }}"
  when:
    - archiveweaver_runtime == 'docker-swarm'
    - inventory_hostname == groups['archiveweaver_control'][0]
  tags: [verify]

- name: Require signed image coverage during Swarm verification
  ansible.builtin.include_tasks: require-signed-image-coverage.yml
  vars:
    archiveweaver_provider_image_coverage_runtime: docker-swarm
    archiveweaver_provider_image_coverage_model: "{{ archiveweaver_provider_verify_swarm_config.stdout }}"
  when:
    - archiveweaver_runtime == 'docker-swarm'
    - inventory_hostname == groups['archiveweaver_control'][0]
  tags: [verify]

- name: Build a safe kubectl argv prefix for provider verification
  ansible.builtin.set_fact:
    archiveweaver_provider_verify_kubectl_argv: >-
      {{ ['kubectl', '--kubeconfig', archiveweaver_kubeconfig,
          '--context', archiveweaver_kube_context, '--request-timeout=30s'] }}
  when: archiveweaver_runtime in ['k3s', 'rke2', 'k0s', 'microk8s']
  tags: [verify]

- name: Inspect the staged Kustomize bundle during verification
  ansible.builtin.stat:
    path: "{{ archiveweaver_kustomize_path }}"
    follow: false
  register: archiveweaver_provider_verify_kustomize_stat
  when:
    - archiveweaver_runtime in ['k3s', 'rke2', 'k0s', 'microk8s']
    - inventory_hostname == groups['archiveweaver_control'][0]
  tags: [verify]

- name: Require the verified Kustomize root to be a real directory
  ansible.builtin.assert:
    that:
      - archiveweaver_provider_verify_kustomize_stat.stat.exists
      - archiveweaver_provider_verify_kustomize_stat.stat.isdir | default(false) | bool
      - not (archiveweaver_provider_verify_kustomize_stat.stat.islnk | default(false) | bool)
      - archiveweaver_provider_verify_kustomize_stat.stat.uid | int == 0
      - archiveweaver_provider_verify_kustomize_stat.stat.gid | int == 0
      - archiveweaver_provider_verify_kustomize_stat.stat.mode is match('^0[0-7][0-5][0-5]$')
    fail_msg: "The verified Kustomize bundle is missing, a file, or a symlink."
  when:
    - archiveweaver_runtime in ['k3s', 'rke2', 'k0s', 'microk8s']
    - inventory_hostname == groups['archiveweaver_control'][0]
  tags: [verify]

- name: Inspect the verified Kustomize tree for symlinks
  ansible.builtin.find:
    paths: "{{ archiveweaver_kustomize_path }}"
    recurse: true
    file_type: link
    hidden: true
    follow: false
  register: archiveweaver_provider_verify_kustomize_links
  no_log: true
  when:
    - archiveweaver_runtime in ['k3s', 'rke2', 'k0s', 'microk8s']
    - inventory_hostname == groups['archiveweaver_control'][0]
  tags: [verify]

- name: Reject symlinks inside the verified Kustomize bundle
  ansible.builtin.assert:
    that:
      - archiveweaver_provider_verify_kustomize_links.files | default([]) | length == 0
    fail_msg: "The verified Kustomize bundle contains a symlink and is not trusted."
  when:
    - archiveweaver_runtime in ['k3s', 'rke2', 'k0s', 'microk8s']
    - inventory_hostname == groups['archiveweaver_control'][0]
  no_log: true
  tags: [verify]

- name: Hash the verified Kustomize file set
  ansible.builtin.find:
    paths: "{{ archiveweaver_kustomize_path }}"
    recurse: true
    file_type: file
    hidden: true
    get_checksum: true
    checksum_algorithm: sha256
  register: archiveweaver_provider_verify_kustomize_files
  no_log: true
  when:
    - archiveweaver_runtime in ['k3s', 'rke2', 'k0s', 'microk8s']
    - inventory_hostname == groups['archiveweaver_control'][0]
  tags: [verify]

- name: Reject ambiguous or nonportable verified Kustomize filenames
  ansible.builtin.assert:
    that:
      - archiveweaver_provider_verify_kustomize_relative_path is match('^[A-Za-z0-9._/-]+$')
    fail_msg: "Verified Kustomize filenames must use the portable digest alphabet."
  vars:
    archiveweaver_provider_verify_kustomize_relative_path: >-
      {{ item.path | replace(archiveweaver_kustomize_path ~ '/', '', 1) }}
  loop: "{{ archiveweaver_provider_verify_kustomize_files.files | default([]) }}"
  loop_control:
    label: "{{ archiveweaver_provider_verify_kustomize_relative_path }}"
  no_log: true
  when:
    - archiveweaver_runtime in ['k3s', 'rke2', 'k0s', 'microk8s']
    - inventory_hostname == groups['archiveweaver_control'][0]
  tags: [verify]

- name: Build the verified Kustomize digest input
  ansible.builtin.set_fact:
    archiveweaver_provider_verify_kustomize_digest_input: >-
      {{ (archiveweaver_provider_verify_kustomize_digest_input | default([])) + [
         (item.path | replace(archiveweaver_kustomize_path ~ '/', '', 1)) ~ ':' ~ item.checksum
      ] }}
  loop: "{{ archiveweaver_provider_verify_kustomize_files.files | default([]) | sort(attribute='path') }}"
  no_log: true
  when:
    - archiveweaver_runtime in ['k3s', 'rke2', 'k0s', 'microk8s']
    - inventory_hostname == groups['archiveweaver_control'][0]
  tags: [verify]

- name: Require the verified Kustomize bundle to match its release digest
  ansible.builtin.assert:
    that:
      - archiveweaver_provider_verify_kustomize_files.files | default([]) | length > 0
      - archiveweaver_kustomize_bundle_sha256 is string
      - archiveweaver_kustomize_bundle_sha256 is match('^[0-9a-f]{64}$')
      - (archiveweaver_provider_verify_kustomize_digest_input | default([]) | join('\n') | hash('sha256')) == archiveweaver_kustomize_bundle_sha256
    fail_msg: "The verified Kustomize bundle has drifted from the reviewed release."
  when:
    - archiveweaver_runtime in ['k3s', 'rke2', 'k0s', 'microk8s']
    - inventory_hostname == groups['archiveweaver_control'][0]
  no_log: true
  tags: [verify]

- name: Require a protected local-only Kustomize closure during verification
  ansible.builtin.include_tasks: verify-kustomize-tree.yml
  when:
    - archiveweaver_runtime in ['k3s', 'rke2', 'k0s', 'microk8s']
    - inventory_hostname == groups['archiveweaver_control'][0]
  tags: [verify]

- name: Re-render the verified Kustomize bundle read-only
  ansible.builtin.command:
    argv: "{{ archiveweaver_provider_verify_kubectl_argv + ['kustomize', archiveweaver_kustomize_path] }}"
  register: archiveweaver_provider_verify_kustomize_render
  changed_when: false
  check_mode: false
  when:
    - archiveweaver_runtime in ['k3s', 'rke2', 'k0s', 'microk8s']
    - inventory_hostname == groups['archiveweaver_control'][0]
  no_log: true
  tags: [verify]

- name: Rehash the protected Kustomize closure after verification render
  ansible.builtin.include_tasks: verify-kustomize-tree.yml
  when:
    - archiveweaver_runtime in ['k3s', 'rke2', 'k0s', 'microk8s']
    - inventory_hostname == groups['archiveweaver_control'][0]
  tags: [verify]

- name: Validate the independently rendered Paperless RKE2 product model
  ansible.builtin.command:
    argv:
      - "{{ archiveweaver_readiness_python }}"
      - "{{ archiveweaver_bundle_root }}/../../scripts/verify-paperless-rke2-model.py"
      - "{{ archiveweaver_namespace }}"
    stdin: "{{ archiveweaver_provider_verify_kustomize_render.stdout }}"
    stdin_add_newline: false
    expand_argument_vars: false
  environment:
    PYTHONDONTWRITEBYTECODE: "1"
  delegate_to: localhost
  become: false
  register: archiveweaver_provider_verify_paperless_model_validation
  changed_when: false
  check_mode: false
  no_log: true
  when:
    - archiveweaver_solution_id == 'paperless-ngx'
    - archiveweaver_runtime == 'rke2'
    - inventory_hostname == groups['archiveweaver_control'][0]
  tags: [verify]

- name: Require immutable images in the verified Kustomize model
  ansible.builtin.include_tasks: require-immutable-images.yml
  vars:
    archiveweaver_provider_rendered_content: "{{ archiveweaver_provider_verify_kustomize_render.stdout }}"
  when:
    - archiveweaver_runtime in ['k3s', 'rke2', 'k0s', 'microk8s']
    - inventory_hostname == (groups['archiveweaver_control'] | default([inventory_hostname]))[0]
  tags: [verify]

- name: Require signed image coverage during Kubernetes verification
  ansible.builtin.include_tasks: require-signed-image-coverage.yml
  vars:
    archiveweaver_provider_image_coverage_runtime: kubernetes
    archiveweaver_provider_image_coverage_model: "{{ archiveweaver_provider_verify_kustomize_render.stdout }}"
  when:
    - archiveweaver_runtime in ['k3s', 'rke2', 'k0s', 'microk8s']
    - inventory_hostname == (groups['archiveweaver_control'] | default([inventory_hostname]))[0]
  tags: [verify]

- name: Read all live Kubernetes workloads during independent verification
  ansible.builtin.command:
    argv: >-
      {{ archiveweaver_provider_verify_kubectl_argv + ['-n', archiveweaver_namespace,
          'get', 'deployments,statefulsets,jobs,cronjobs', '-o', 'json'] }}
  register: archiveweaver_provider_verify_live_workloads
  changed_when: false
  check_mode: false
  when:
    - archiveweaver_runtime in ['k3s', 'rke2', 'k0s', 'microk8s']
    - inventory_hostname == (groups['archiveweaver_control'] | default([inventory_hostname]))[0]
  no_log: true
  tags: [verify]

- name: Compare independent live Kubernetes workloads with the reviewed bundle
  ansible.builtin.command:
    argv:
      - "{{ archiveweaver_readiness_python }}"
      - "{{ archiveweaver_bundle_root }}/../../scripts/verify-live-kubernetes-workloads.py"
      - "{{ archiveweaver_namespace }}"
    stdin: >-
      {{ {'rendered_yaml': archiveweaver_provider_verify_kustomize_render.stdout,
          'live_json': (archiveweaver_provider_verify_live_workloads.stdout | from_json)} | to_json }}
    stdin_add_newline: false
    expand_argument_vars: false
  environment:
    PYTHONDONTWRITEBYTECODE: "1"
  delegate_to: localhost
  become: false
  register: archiveweaver_provider_verify_live_workload_result
  changed_when: false
  check_mode: false
  when:
    - archiveweaver_runtime in ['k3s', 'rke2', 'k0s', 'microk8s']
    - inventory_hostname == (groups['archiveweaver_control'] | default([inventory_hostname]))[0]
  no_log: true
  tags: [verify]

- name: Require independent live workload images to match the reviewed release
  ansible.builtin.assert:
    that:
      - archiveweaver_provider_verify_live_workload_result.rc == 0
    fail_msg: "Independent verification found a missing, extra, or changed Kubernetes workload image."
  when:
    - archiveweaver_runtime in ['k3s', 'rke2', 'k0s', 'microk8s']
    - inventory_hostname == (groups['archiveweaver_control'] | default([inventory_hostname]))[0]
  no_log: true
  tags: [verify]

- name: Inventory live namespaced Kubernetes resources during independent verification
  ansible.builtin.command:
    argv: >-
      {{ archiveweaver_provider_verify_kubectl_argv + ['-n', archiveweaver_namespace,
          'get', ('deployments,statefulsets,daemonsets,jobs,cronjobs,pods,replicasets,'
                  ~ 'services,ingresses,networkpolicies,persistentvolumeclaims,secrets,configmaps,serviceaccounts,'
                  ~ 'resourcequotas,limitranges,poddisruptionbudgets,horizontalpodautoscalers,roles,rolebindings'),
          '-o', 'json'] }}
  register: archiveweaver_provider_verify_live_resources
  changed_when: false
  check_mode: false
  when:
    - archiveweaver_runtime == 'rke2'
    - archiveweaver_solution_id == 'paperless-ngx'
    - inventory_hostname == (groups['archiveweaver_control'] | default([inventory_hostname]))[0]
  no_log: true
  tags: [verify]

- name: Reject unreviewed live namespaced Kubernetes resources during independent verification
  ansible.builtin.command:
    argv:
      - "{{ archiveweaver_readiness_python }}"
      - "{{ archiveweaver_bundle_root }}/../../scripts/verify-live-kubernetes-resources.py"
      - "{{ archiveweaver_namespace }}"
    stdin: >-
      {{ {'rendered_yaml': archiveweaver_provider_verify_kustomize_render.stdout,
          'live_json': (archiveweaver_provider_verify_live_resources.stdout | from_json)} | to_json }}
    stdin_add_newline: false
    expand_argument_vars: false
  environment:
    PYTHONDONTWRITEBYTECODE: "1"
  delegate_to: localhost
  become: false
  register: archiveweaver_provider_verify_resource_inventory
  changed_when: false
  check_mode: false
  when:
    - archiveweaver_runtime == 'rke2'
    - archiveweaver_solution_id == 'paperless-ngx'
    - inventory_hostname == (groups['archiveweaver_control'] | default([inventory_hostname]))[0]
  no_log: true
  tags: [verify]

- name: Require every live Kubernetes resource to match the verified model
  ansible.builtin.command:
    argv: >-
      {{ archiveweaver_provider_verify_kubectl_argv + ['-n', archiveweaver_namespace,
          'diff', '--show-secrets', '-f', '-'] }}
    stdin: "{{ archiveweaver_provider_verify_kustomize_render.stdout }}"
    stdin_add_newline: false
  environment:
    KUBECTL_EXTERNAL_DIFF: /usr/bin/diff
  register: archiveweaver_provider_verify_resource_diff
  changed_when: false
  failed_when: archiveweaver_provider_verify_resource_diff.rc != 0
  check_mode: false
  when:
    - archiveweaver_runtime in ['k3s', 'rke2', 'k0s', 'microk8s']
    - inventory_hostname == groups['archiveweaver_control'][0]
  no_log: true
  tags: [verify]
