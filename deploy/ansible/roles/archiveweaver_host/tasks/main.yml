---
- name: Require completed controller preflight
  ansible.builtin.include_tasks:
    file: "{{ role_path | dirname }}/archiveweaver_controller_preflight/tasks/require-complete.yml"
    apply:
      tags: [host, deploy]
  tags: [host, deploy]

- name: Require completed managed-host preflight
  ansible.builtin.include_tasks:
    file: "{{ role_path | dirname }}/archiveweaver_controller_preflight/tasks/require-managed-complete.yml"
    apply:
      tags: [host, deploy]
  tags: [host, deploy]

- name: Install common host prerequisites on Debian-family systems
  ansible.builtin.apt:
    name: "{{ archiveweaver_packages_debian }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  when:
    - archiveweaver_manage_packages | bool
    - ansible_facts.os_family == 'Debian'
  tags: [host, packages]

- name: Install common host prerequisites on RedHat-family systems
  ansible.builtin.dnf:
    name: "{{ archiveweaver_packages_redhat }}"
    state: present
  when:
    - archiveweaver_manage_packages | bool
    - ansible_facts.os_family == 'RedHat'
  tags: [host, packages]

- name: Create the dedicated service account
  ansible.builtin.user:
    name: archiveweaver
    system: true
    create_home: false
    shell: /usr/sbin/nologin
    state: present
  tags: [host, identity]

- name: Create application, log, and release-record directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ archiveweaver_data_root }}", owner: archiveweaver, group: archiveweaver, mode: '0750'}
    - {path: "{{ archiveweaver_log_root }}", owner: archiveweaver, group: archiveweaver, mode: '0750'}
    - {path: "{{ archiveweaver_release_record | dirname }}", owner: root, group: root, mode: '0755'}
  tags: [host, filesystem]
