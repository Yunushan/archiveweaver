---
- name: Require completed managed-host preflight
  ansible.builtin.assert:
    that:
      - (ansible_skip_tags | default([]) | intersect(['preflight']) | length) == 0
      - hostvars[inventory_hostname].archiveweaver_preflight_completed | default(false) | bool
    fail_msg: "Managed-host preflight must complete before this operational role can run."
  no_log: true
