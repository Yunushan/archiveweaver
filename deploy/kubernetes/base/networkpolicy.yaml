apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: archiveweaver-app-default
  labels:
    app.kubernetes.io/name: archiveweaver-app
    app.kubernetes.io/managed-by: archiveweaver
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: archiveweaver-app
  policyTypes:
    - Ingress
    - Egress
  # Add separate product-specific allow policies for reviewed ingress, DNS,
  # database, search, queue, and object-store destinations.
  ingress: []
  egress: []
