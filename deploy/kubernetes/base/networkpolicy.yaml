apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: archiveweaver-app-default
  labels:
    app.kubernetes.io/name: archiveweaver-app
    app.kubernetes.io/managed-by: archiveweaver
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: archiveweaver-app
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: http
  egress:
    - {}
