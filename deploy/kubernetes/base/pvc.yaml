apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: archiveweaver-data
  labels:
    app.kubernetes.io/name: archiveweaver-app
    app.kubernetes.io/managed-by: archiveweaver
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: archiveweaver-rwx
  resources:
    requests:
      storage: 100Gi
