version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-build:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /deploy/ansible
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      ansible-controller:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /deploy/ansible/execution-environment
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      ansible-execution-environment:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /requirements
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      release-validation-tools:
        patterns: ["*"]
