name: Bug report
description: Report a reproducible, non-sensitive defect in ArchiveWeaver.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: >-
        Do not include credentials, private archive content, inventories,
        unredacted controller output, or vulnerability details. Use the
        private security-reporting process for security issues.
  - type: input
    id: version
    attributes:
      label: ArchiveWeaver version or commit
      placeholder: v0.1.0 or a full commit SHA
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Local planning or rendering
        - CI or packaging
        - Isolated staging or certification
        - Production (sanitized report only)
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Python, OS, runtime, and product
      placeholder: Python 3.14; Ubuntu 24.04; RKE2; Paperless-ngx
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Provide the smallest safe sequence that reproduces the defect.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized evidence
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I removed secrets, private data, real inventories, and identifying controller output.
          required: true
        - label: I did not test destructive behavior against a production system.
          required: true
