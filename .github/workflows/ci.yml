name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install contract validation dependency
        run: python -m pip install --disable-pip-version-check --no-input PyYAML==6.0.2
      - name: Generate catalog
        run: python scripts/generate_catalog.py
      - name: Reject generated-artifact drift
        run: git diff --exit-code
      - name: Validate and test
        run: make test

  yaml-and-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Shell syntax
        run: bash -n scripts/*.sh tests/*.sh
      - name: Operational runner behavior
        run: bash tests/test-operational-runner.sh
      - name: Execution-environment builder policy
        run: bash tests/test-execution-environment.sh
      - name: Check YAML availability
        run: python -m compileall -q src scripts tests

  ansible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install pinned Ansible controller
        run: python -m pip install -r deploy/ansible/requirements.txt
      - name: Validate Ansible playbooks
        run: bash scripts/validate-ansible.sh

