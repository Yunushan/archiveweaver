name: ClusterFuzzLite PR fuzzing

on:
  pull_request:

permissions:
  contents: read
  security-events: write

concurrency:
  group: cflite-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: ClusterFuzzLite Python
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build Python fuzzers
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python
          github-token: ${{ github.token }}
          sanitizer: address
      - name: Run code-change fuzzing
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ github.token }}
          fuzz-seconds: 300
          mode: code-change
          output-sarif: true
          parallel-fuzzing: true
          sanitizer: address
      - name: Upload fuzzing SARIF
        if: ${{ always() && steps.build.outcome == 'success' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: cifuzz-sarif/results.sarif
