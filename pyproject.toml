[build-system]
requires = [
  "setuptools==82.0.1; python_version < '3.10'",
  "setuptools==84.0.0; python_version >= '3.10'",
]
build-backend = "setuptools.build_meta"

[project]
name = "archiveweaver"
version = "0.1.0"
description = "Deployment planning, health checking, and safe repair automation for digital archiving platforms"
readme = "README.md"
requires-python = ">=3.9"
license = "0BSD"
license-files = ["LICENSE"]
authors = [{ name = "ArchiveWeaver contributors" }]
keywords = ["digital-archives", "digital-preservation", "dms", "devops", "ha", "kubernetes", "ansible", "site-reliability"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]

[project.urls]
Homepage = "https://github.com/Yunushan/archiveweaver"
Documentation = "https://github.com/Yunushan/archiveweaver/tree/main/docs"
Repository = "https://github.com/Yunushan/archiveweaver.git"
Issues = "https://github.com/Yunushan/archiveweaver/issues"

[project.scripts]
archiveweaver = "archiveweaver.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
archiveweaver = ["data/*.json"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
# Mypy 2.x supports 3.10+; CI still executes the package on Python 3.9.
python_version = "3.10"
strict = true

[tool.coverage.run]
branch = true
source = ["archiveweaver"]

[tool.coverage.report]
fail_under = 100
show_missing = true
