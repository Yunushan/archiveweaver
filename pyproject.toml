[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "archiveweaver"
version = "0.1.0"
description = "Deployment planning, health checking, and safe repair automation for digital archiving platforms"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "ArchiveWeaver contributors" }]
keywords = ["digital-archives", "digital-preservation", "dms", "devops", "ha", "kubernetes"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Zero-Clause BSD",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]

[project.scripts]
archiveweaver = "archiveweaver.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
archiveweaver = ["data/*.json"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

